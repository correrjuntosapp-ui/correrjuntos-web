<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="Piramide de prioridades para perder grasa: la base son deficit calorico, proteina, fuerza y volumen, y descanso; los suplementos son la punta pequena">
  <defs>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f97316" stop-opacity="0.95"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="l4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#f97316"/></linearGradient>
  </defs>
  <rect width="920" height="520" fill="none"/>
  <!-- number badges + connector labels on the right -->
  <!-- Layer 1 (base, widest) -->
  <path d="M120,470 L800,470 L740,398 L180,398 Z" fill="url(#l1)"/>
  <text x="460" y="443" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff">1</text>
  <!-- Layer 2 -->
  <path d="M180,390 L740,390 L688,320 L232,320 Z" fill="url(#l2)"/>
  <text x="460" y="365" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">2</text>
  <!-- Layer 3 -->
  <path d="M232,312 L688,312 L634,242 L286,242 Z" fill="url(#l3)"/>
  <text x="460" y="288" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">3</text>
  <!-- Layer 4 -->
  <path d="M286,234 L634,234 L580,164 L340,164 Z" fill="url(#l4)"/>
  <text x="460" y="212" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">4</text>
  <!-- Tip: supplements (tiny) -->
  <path d="M340,156 L580,156 L510,70 L410,70 Z" fill="#1f2937"/>
  <path d="M340,156 L580,156 L510,70 L410,70 Z" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="460" y="120" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fb923c">5</text>
  <!-- small caption arrow to tip -->
  <text x="460" y="44" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#9a3412" letter-spacing="2">%</text>
  <line x1="460" y1="52" x2="460" y2="66" stroke="#9a3412" stroke-width="2"/>
</svg>
