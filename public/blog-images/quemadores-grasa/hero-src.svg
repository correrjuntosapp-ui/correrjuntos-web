<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2436"/>
      <stop offset="0.55" stop-color="#131a29"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- motion / speed lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="150" x2="360" y2="150"/>
    <line x1="40" y1="205" x2="300" y2="205"/>
    <line x1="80" y1="500" x2="420" y2="500"/>
    <line x1="60" y1="548" x2="360" y2="548"/>
  </g>

  <!-- energy balance motif: IN vs OUT scale (deficit) -->
  <g transform="translate(820,150)" opacity="0.92">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#f9a03f" stroke-width="3" stroke-opacity="0.6"/>
    <!-- beam tilted (deficit: OUT heavier / lower right) -->
    <g transform="rotate(9)">
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#f9a03f" stroke-width="4" stroke-opacity="0.7"/>
      <!-- left pan: energy IN -->
      <g transform="translate(-120,0)">
        <path d="M-34,4 A34,20 0 0 0 34,4" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-opacity="0.55"/>
        <line x1="-30" y1="0" x2="0" y2="4" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="30" y1="0" x2="0" y2="4" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.4"/>
        <text x="0" y="-12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#cbd5e1" fill-opacity="0.65" letter-spacing="2">IN</text>
      </g>
      <!-- right pan: energy OUT (bigger) -->
      <g transform="translate(120,0)">
        <path d="M-42,6 A42,26 0 0 0 42,6" fill="none" stroke="#f97316" stroke-width="3" stroke-opacity="0.8"/>
        <line x1="-38" y1="0" x2="0" y2="6" stroke="#f97316" stroke-width="1.6" stroke-opacity="0.55"/>
        <line x1="38" y1="0" x2="0" y2="6" stroke="#f97316" stroke-width="1.6" stroke-opacity="0.55"/>
        <text x="0" y="-14" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#f9a03f" fill-opacity="0.85" letter-spacing="2">OUT</text>
      </g>
    </g>
  </g>

  <!-- stylized runner silhouette (lower right) -->
  <g transform="translate(560,300)" fill="#f97316">
    <g transform="scale(2.15)">
      <!-- head -->
      <circle cx="96" cy="18" r="12"/>
      <!-- torso -->
      <path d="M92,30 l18,6 l-6,40 l-16,-4 Z"/>
      <!-- front arm -->
      <path d="M108,38 l26,-6 l4,9 l-27,7 Z"/>
      <!-- back arm -->
      <path d="M92,36 l-22,10 l5,9 l22,-11 Z"/>
      <!-- front thigh + shin (driving knee) -->
      <path d="M100,72 l26,10 l-6,15 l-24,-11 Z"/>
      <path d="M126,82 l10,26 l-11,4 l-11,-24 Z"/>
      <!-- back leg extended -->
      <path d="M88,70 l-24,26 l10,9 l24,-25 Z"/>
      <path d="M64,96 l-20,8 l4,11 l20,-9 Z"/>
    </g>
  </g>
</svg>
