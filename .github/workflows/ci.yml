name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint

      - name: Build (minify JS)
        run: node tools/build-minify.cjs

      # La suite E2E de Playwright (tests/e2e) esta OBSOLETA desde el refactor
      # del 25 abr 2026 (aea2dcb9): prueba la arquitectura SPA con modales que
      # ya no existe, fallaba 40/40 y reventaba el timeout de 15 min dejando
      # TODOS los pushes a master en `cancelled` desde el ~18 ago. Se retira
      # del CI hasta reescribirla contra la arquitectura actual; los specs
      # siguen en tests/e2e como referencia. NO reactivar sin reescribir.
      - name: Unit tests
        run: npm run test:unit

      # Datos estructurados JSON-LD. Search Console reporto en agosto de 2026
      # un itemReviewed invalido; la auditoria posterior encontro 85 defectos
      # (referencias @id sin resolver, Article sin image/author/publisher,
      # Offer sin precio, Review huerfano). Estas dos comprobaciones evitan que
      # vuelvan sin que nos enteremos por correo.
      - name: JSON-LD — autocomprobacion del verificador
        run: npm run test:jsonld:selftest

      - name: JSON-LD — auditoria del sitio
        run: npm run test:jsonld
